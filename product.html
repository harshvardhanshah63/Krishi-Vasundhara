<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/sass/product.css">
</head>
<body>
    <div class="container">
        <div class="product-card">
            <div class="grid md:grid-cols-2 gap-6">
                <img src="https://via.placeholder.com/400" alt="Product Image" class="product-img">
                <div>
                    <h1 class="text-3xl font-bold mb-2">Organic Fertilizer</h1>
                    <p class="text-gray-600 text-lg mb-4">Best fertilizer for soil enrichment.</p>
                    <span class="text-2xl font-semibold text-green-600">$19.99</span>
                    <div class="mt-4">
                        <button class="btn-primary">Buy Now</button>
                        <button class="btn-secondary" onclick="shareProduct()">Share</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="product-card mt-6">
            <h2 class="text-2xl font-bold mb-4">Recommended Fertilizers</h2>
            <div class="grid md:grid-cols-3 gap-4">
                <div class="recommendation-card">
                    <h3 class="font-semibold">Nitrogen-Based Fertilizer</h3>
                    <p class="text-sm text-gray-600">Ideal for leafy vegetables and crops.</p>
                </div>
                <div class="recommendation-card">
                    <h3 class="font-semibold">Phosphorus Fertilizer</h3>
                    <p class="text-sm text-gray-600">Best for root development.</p>
                </div>
                <div class="recommendation-card">
                    <h3 class="font-semibold">Potassium Fertilizer</h3>
                    <p class="text-sm text-gray-600">Great for fruit-bearing plants.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function shareProduct() {
            const url = window.location.href;
            const text = "Check out this amazing organic fertilizer!";
            const shareLink = `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`;
            window.open(shareLink, '_blank');
        }
    </script>
</body>
</html>
